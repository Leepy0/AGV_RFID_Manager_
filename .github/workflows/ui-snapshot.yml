name: UI Snapshot

# 에뮬레이터에서 앱을 실행해 주요 화면을 캡처
# 수동 실행 또는 커밋 메시지에 [snap]이 있을 때만 실행
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "캡처에 쓸 빌드 (debug / release — release는 R8 축소 빌드 검증용)"
        type: choice
        options: [debug, release]
        default: debug
  push:
    branches: [ master ]
    # 문서·매뉴얼(docs/)만 바뀐 푸시는 빌드하지 않음 (앱 변경 없이 업데이트가 뜨는 것 방지)
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/pages.yml'

permissions:
  contents: write

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[snap]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: KVM 활성화
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: KVM 확인
        run: |
          ls -la /dev/kvm && echo "::notice title=KVM::available" || echo "::warning title=KVM::not available"

      - name: 디버그 APK 빌드
        run: |
          chmod +x gradlew
          # versionCode를 1로 낮춰 빌드 → 앱 내 업데이트 흐름(안내·다운로드·설치)까지 캡처
          BT="${{ github.event.inputs.build_type || 'debug' }}"
          echo "::notice title=Build type::$BT"
          ./gradlew "assemble${BT^}" -PversionCodeOverride=1

      - name: 에뮬레이터 실행 및 캡처
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash .github/scripts/snap.sh

      # Release 업로드가 실패해도 캡처를 잃지 않도록 워크플로 아티팩트에도 보관
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: snaps
          if-no-files-found: ignore

      - name: 캡처 업로드 (ui-snapshots Release)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la snaps || exit 0
          gh release delete ui-snapshots --cleanup-tag -y || true
          # 1) 릴리스 먼저 만들고 (실패하면 어떤 권한이 필요한지 응답 헤더 X-Accepted-GitHub-Permissions 로 확인)
          if ! gh release create ui-snapshots --target "$GITHUB_SHA" --prerelease --title "UI snapshots" --notes "commit ${GITHUB_SHA::7}"; then
            echo "::warning title=release create failed::아래 응답 헤더 확인"
            gh api --include -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name=ui-snapshots -f target_commitish="$GITHUB_SHA" -F prerelease=true -f name="UI snapshots" 2>&1 | head -40 || true
            exit 1
          fi
          # 2) 파일 올리기
          gh release upload ui-snapshots snaps/* --clobber
