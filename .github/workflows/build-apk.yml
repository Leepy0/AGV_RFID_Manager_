name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:   # Actions 탭에서 수동 실행

permissions:
  contents: write      # Release 생성용

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # versionCode = 커밋 수 (전체 이력 필요)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK는 runner에 기본 설치됨 (부족한 platform은 AGP가 자동 다운로드)
      - uses: gradle/actions/setup-gradle@v4

      # debug 서명 키는 app/build.gradle.kts의 signingConfigs에서 app/debug.keystore로 고정
      - name: 디버그 APK 빌드
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log

      # 실패 시 오류 요약을 annotation으로 남김 (로그 없이도 원인 확인용)
      - name: 빌드 오류 요약
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          MSG=$( { grep -E "^(e|w): " build.log | grep "^e: " | head -20; grep -A20 "What went wrong" build.log || tail -40 build.log; } | head -60 )
          MSG="${MSG//'%'/'%25'}"; MSG="${MSG//$'\n'/'%0A'}"; MSG="${MSG//$'\r'/'%0D'}"
          echo "::error title=Gradle build failed::$MSG"

      # 버전 범위로 받은 라이브러리 실제 버전 기록
      - name: 의존성 버전 기록
        continue-on-error: true
        run: |
          V=$(./gradlew -q :app:dependencies --configuration debugRuntimeClasspath | grep -m1 "dev.chrisbanes.haze:haze:" | sed "s/^[^d]*//" || true)
          echo "::notice title=Haze version::$V"

      - name: APK 경로 확인
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      # 앱 내 업데이트용 버전 정보 (versionCode는 build.gradle.kts와 같은 커밋 수)
      - name: version.json 생성
        id: ver
        run: |
          CODE=$(git rev-list --count HEAD)
          NAME="${{ steps.apk.outputs.name }}"
          VN=$(echo "$NAME" | sed -E 's/^AGV_RFID_Manager_v(.+)\.apk$/\1/')
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-debug/${NAME}"
          NOTES=$(git log -1 --pretty=%s | sed -E 's/ *\[snap\]//')
          jq -n --argjson code "$CODE" --arg name "$VN" --arg url "$URL" --arg notes "$NOTES" \
            '{versionCode: $code, versionName: $name, url: $url, notes: $notes}' > version.json
          cat version.json
          echo "::notice title=App version::v$VN build $CODE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      # 항상 같은 주소(latest-debug)로 최신 APK 덮어쓰기
      - name: Release(latest-debug) 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --cleanup-tag -y || true
          gh release create latest-debug "${{ steps.apk.outputs.path }}" version.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest debug build" \
            --notes "branch: ${GITHUB_REF_NAME} / commit: ${GITHUB_SHA::7} / run #${GITHUB_RUN_NUMBER}"
