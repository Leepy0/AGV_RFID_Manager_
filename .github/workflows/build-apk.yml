name: Build APK

on:
  push:
    branches: [ master, ci/build-apk ]
  workflow_dispatch:   # Actions 탭에서 수동 실행

permissions:
  contents: write      # Release 생성용

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK는 runner에 기본 설치됨 (부족한 platform은 AGP가 자동 다운로드)
      - uses: gradle/actions/setup-gradle@v4

      # 고정 debug keystore 사용 → 빌드마다 서명이 같아서 덮어쓰기 설치 가능
      - name: Debug keystore 설정
        run: |
          mkdir -p ~/.android
          cp .github/debug.keystore ~/.android/debug.keystore

      - name: 디버그 APK 빌드
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log

      # 실패 시 오류 요약을 annotation으로 남김 (로그 없이도 원인 확인용)
      - name: 빌드 오류 요약
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          MSG=$( { grep -E "^(e|w): " build.log | grep "^e: " | head -20; grep -A20 "What went wrong" build.log || tail -40 build.log; } | head -60 )
          MSG="${MSG//'%'/'%25'}"; MSG="${MSG//$'\n'/'%0A'}"; MSG="${MSG//$'\r'/'%0D'}"
          echo "::error title=Gradle build failed::$MSG"

      - name: APK 경로 확인
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      # 항상 같은 주소(latest-debug)로 최신 APK 덮어쓰기
      - name: Release(latest-debug) 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --cleanup-tag -y || true
          gh release create latest-debug "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest debug build" \
            --notes "branch: ${GITHUB_REF_NAME} / commit: ${GITHUB_SHA::7} / run #${GITHUB_RUN_NUMBER}"
