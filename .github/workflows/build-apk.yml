name: Build APK

on:
  push:
    branches: [ master ]
    # 문서·매뉴얼(docs/)만 바뀐 푸시는 빌드하지 않음
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:   # Actions 탭에서 수동 실행

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # versionCode = 커밋 수 (전체 이력 필요)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK는 runner에 기본 설치됨 (부족한 platform은 AGP가 자동 다운로드)
      - uses: gradle/actions/setup-gradle@v4

      # 빌드 확인용: 업로드 키가 없어 debug 키로 서명됨 → Play 업로드용 AAB는 PC에서 업로드 키로 만든다
      - name: APK·AAB 빌드 (release)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease bundleRelease 2>&1 | tee build.log

      # 실패 시 오류 요약을 annotation으로 남김 (로그 없이도 원인 확인용)
      - name: 빌드 오류 요약
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          MSG=$( { grep -E "^(e|w): " build.log | grep "^e: " | head -20; grep -A20 "What went wrong" build.log || tail -40 build.log; } | head -60 )
          MSG="${MSG//'%'/'%25'}"; MSG="${MSG//$'\n'/'%0A'}"; MSG="${MSG//$'\r'/'%0D'}"
          echo "::error title=Gradle build failed::$MSG"

      # 버전 범위로 받은 라이브러리 실제 버전 기록
      - name: 의존성 버전 기록
        continue-on-error: true
        run: |
          V=$(./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath | grep -m1 "dev.chrisbanes.haze:haze:" | sed "s/^[^d]*//" || true)
          echo "::notice title=Haze version::$V"

      - name: APK 경로 확인
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
